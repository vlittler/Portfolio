        date: "Sept 2011 - May 2013"
        content: |-
          A-Levels: 1 B Grade, 5 C Grades
          
  # projects
  projects:
    enable: true
    title: "Projects."
    items:
      - title: Growing Video Game Sales
        content: A personal project exploring the video games industry to understand sales performance and market trends.
        image: /images/projects/Growing_Video_Games.png
        featured:
          name: View
          link: https://github.com/vlittler/Video-Game-Analysis-Project
        badges:
          - "SQL"
          - "Tableau"
          - "Excel"
        links:
          - icon: fab fa-github
            url: https://github.com/vlittler/Video-Game-Analysis-Project

  # Achievements
  achievements:
    enable: true
    title: "Qualifications."
    items:
      - title: Level 4 Diploma in Digital Marketing
        content: City & Guilds
      - title: BTEC Level 3 Certificate in Principles of Marketing
        content: Pearson Edexcel
      - title: Edexcel Level 3 NVQ Diploma in Marketing
        content: Pearson Edexcel
      - title: Advanced Apprenticeship in Marketing
        content: Instructus Skills
      - title: Award in General Data Protection Regulation
        content: Institute of Data & Marketing

  #Contact
  contact:
    enable: false
    title: "Talk to me"
    content: 
    btnName: Contact
    btnLink: mailto:littler-94@hotmail.co.uk
