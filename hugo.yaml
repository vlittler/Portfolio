baseURL: "https://hugo-profile.netlify.app"
languageCode: "en-gb"
title: "Vanessa Littler | Portfolio"
theme: hugo-profile

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

#services:
  #googleAnalytics:
    #id: G-MEASUREMENT_ID
  #disqus:
    #shortname: your-disqus-shortname

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

    #Dropdown menu
    # - identifier: dropdown
    #   title: Example dropdown menu
    #   name: Dropdown
    #   weight: 3
    # - identifier: dropdown1
    #   title: example dropdown 1
    #   name: example 1
    #   url: /#
    #   parent: dropdown
    #   weight: 1
    # - identifier: dropdown2
    #   title: example dropdown 2
    #   name: example 2
    #   url: /#
    #   parent: dropdown
    #   weight: 2

params:
  title: "Vanessa Littler | Portfolio"
  description:  Vanessa Littler is an Insights Analyst based within Cheshire who delivers detailed analysis and actionable insights to drive sales performance.
  # staticPath: ""  # The path to serve the static files from
  favicon: "" # footer icon

  # Whether to serve bootstrap css and js files from CDN or not. Can be set to true, "css" or "js" to choose between
  # serving both, only the css, or only the js files through the CDN. Any other value will make so that CDN is not used.
  # Note the lack of "" in true, it should be of boolean type.
  useBootstrapCDN: false

  # If you want to load dynamically responsive images from Cloudinary
  # This requires your images to be uploaded + hosted on Cloudinary
  # Uncomment and change YOUR_CLOUD_NAME to the Cloud Name in your Cloudinary console
  # cloudinary_cloud_name: "YOUR_CLOUD_NAME"

  # Whether to add mathjax support on all pages. Alternatively, you can opt-in per page by adding `mathjax: true` in the frontmatter.
  mathjax: false

  # Whether the fade animations on the home page will be enabled
  animate: false

  theme:
    disableThemeToggle: true
    defaultTheme: dark

  font:
    fontSize: 1rem # default: 1rem
    fontWeight: 400 # default: 400
    lineHeight: 1.5 # default: 1.5
    textAlign: left # default: left

  color:
     darkmode:
        textColor: "#f3ede4"
        secondaryTextColor: "#f3ede4"
        textLinkColor: "#e8b04b"
        backgroundColor: "#1f1b17"
        secondaryBackgroundColor: "#362f28"
        primaryColor: "#e8b04b"
        secondaryColor: "#362f28"

  # color preference
  # When using hex codes for colors, quotations must be used along with the # sign
  # color:
  #   textColor: "#343a40"
  #   secondaryTextColor: "#6c757d"
  #   textLinkColor: "#007bff"
  #   backgroundColor: "#eaedf0"
  #   secondaryBackgroundColor: "#64ffda1a"
  #   primaryColor: "#007bff"
  #   secondaryColor: "#f8f9fa"

  #   darkmode:
  #     textColor: "#e4e6eb"
  #     secondaryTextColor: "#b0b3b8"
  #     textLinkColor: "#ffffff"
  #     backgroundColor: "#18191a"
  #     secondaryBackgroundColor: "#212529"
  #     primaryColor: "#ffffff"
  #     secondaryColor: "#212529"

  # If you want to customize the menu, you can change it here
  navbar:
    align: ms-auto # Left: ms-auto | center: mx-auto | right: me-auto | Default: ms-auto
    # brandLogo: "/logo.png" # Logo for the brand | default is the favicon variable
    showBrandLogo: false
    brandName: "Vanessa Littler." # Brand name for the brand | default is the title variable
    disableSearch: true
    # searchPlaceholder: "Search"
    stickyNavBar:
      enable : true
      showOnScrollUp : true
    enableSeparator: true
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: false
      disableContact: false

  # Hero
  hero:
    enable: true
    intro: "Insights Analyst & Marketing Professional | Cheshire, UK"
    title: "Vanessa Littler."
    subtitle: I deliver actionable insights.
    content: "Whether it’s to grow sales, improve lead conversion or refine the customer journey, I don’t just look for trends – I provide action and decisions."
    image: "/images/vanessa_littler.png"
    bottomImage:
      enable: false
    roundImage: true
    # roundImage: true # Make hero image circular | default false
    button:
      enable: true
      name: "Resume"
      url: "/assets/2026 Vanessa Littler CV.pdf"
      download: true
      newPage: true
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: https://github.com/vlittler
        
        - icon: fab fa-linkedin
          url: https://www.linkedin.com/in/vanessalittler
        
      # customIcons:
        # - icon: /fav.png
        #  url: "https://example.com"

  # About
  about:
    enable: true
    title: "About."
    content: |-
      I’m an insights analyst and marketing professional based in Cheshire with thirteen years’ experience within the card payments industry – including card machines, ecommerce, bill payments and the convenience sector.

      I’ve dipped my hand into various points of the sales funnel; from generating leads through marketing campaigns to supporting lead conversion through actionable insights. That’s why I’m committed to delivering details analytics to help drive high-quality leads and boost sales performance.
    skills:
      enable: true
      title: "Skills:"
      items:
        - "BigQuery"
        - "Google Analytics"
        - "Tableau"
        - "Excel"
        - "SQL"
        - "PowerPoint"

  # Experience
  experience:
    enable: true
    title: "Experience."
    items:
      - company: "Takepayments Limited"
        companyUrl: https://www.takepayments.com/
        jobs:
          - name: "Team Lead - Insights"
            date: "Feb 2026 - Jul 2026"
            content: "Within my latest role, I advanced from insights analyst to become the team lead. During this, I lead a team of nine insights analysts, allocating workload, managing rotas and balancing resources to maintain service levels, achieve reporting deadlines and SLA commitments. I continuously working alongside the Sales Support Manager to improve team output, as well as create connections between the telemarketing department and the insights team."
          - name: "Insights Analyst"
            date: "Jan 2020 - Feb 2026"
            content: "As an insights analyst, I worked on producing performance reports and providing actionable insights for sales coaching, lead management strategies and operational decision-making. I worked closely with the Sales Support Manager to help improve existing processes within the team, improving the speed, efficiency and output of team tasks and daily activities."

      - company: "Payzone UK"
        companyUrl: https://www.payzone.co.uk/
        jobs:
          - name: "Marketing Executive & Digital Support"
            date: "May 2019 - Dec 2019"
            content: "I played a key role in the company’s rebrand, helping project manage the marketing teams focus to make a smooth transition for both internal and external stakeholders. I created new content such as landing pages, contact forms and blog posts for the new website, working alongside the content manager to ensure correct usage of brand tone whilst also helping to manage the old website and old social media sites during this transition."
          - name: "Digital Marketing Executive"
            date: "Nov 2017 - May 2019"
            content: "I advanced to digital marketing executive, continuing to create and update content for the website, as well as create and send out email campaigns based on current and ongoing promotions for both new and existing customers. I also continued to run the company’s social media sites as well as working with our external content writer to create blog posts for the website."
          - name: "Marketing Assistant"
            date: "Apr 2016 - Nov 2017"
            content: "During my time as a marketing assistant, I worked directly under the Head of Marketing, dipping my hand into various areas of the marketing department. One key focus was moving away from traditional marketing and boosting digital marketing. For this, I was tasked with creating, updating and improving content to help assist with the launch of the company’s new website with a focus on SEO optimisation."
          - name: "Marketing Administrator"
            date: "Jul 2014 - Apr 2016"
            content: "After being employed full time within the company, I supported the Marketing & Brand Manager with updating and creating promotional flyers, business cards and paper applications, as well as collaborating with the internal Project Management team to ensure smooth partnership launches."
          - name: "Marketing Apprentice"
            date: "Jul 2013 - Jul 2014"
            content: "Whilst working on my NVQ qualifications, I managed the company’s social media content, including Twitter(X), Facebook and Pinterest. During my apprenticeship, I also supported my colleagues with creating content for email campaigns focused on both current customers and new customers and monitoring POS stock levels."

  # Education
  education:
    enable: false
    # title: "Custom Name"
    index: false
    items:
      - title: "Level 4 Diploma in Digital Marketing"
        school:
          name: City & Guilds
          url: "https://www.cityandguilds.com/"
        date: "2020"
        content:
          Achieved as part of marketing apprenticeship.
      - title: "Award in General Data Protection Regulation (GDPR)"
        school:
          name: Insitute of Data & Marketing
          url: "https://www.theidm.com/"
        date: "2018"
        content:
          Achieved as part of marketing apprenticeship.
      - title: "BTEC Level 3 Certificate in Principles of Marketing"
        school:
          name: Pearson Edexcel
          url: "https://qualifications.pearson.com/en/home.html"
        date: "2016"
        content:
          Achieved as part of marketing apprenticeship.
      - title: "Level 3 NVQ Diploma in Marketing"
        school:
          name: Pearson Edexcel
